<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Excel转图片">
    <meta name="theme-color" content="#3498db">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://neeko-copilot.bytedance.net/api/text2image?prompt=Excel%20to%20image%20converter%20app%20icon%2C%20modern%20flat%20design%2C%20blue%20color%20scheme&image_size=square">
    <title>Excel 转高清图片</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Excel 转高清图片</h1>
        <div class="upload-section">
            <input type="file" id="excelFile" accept=".xlsx,.xls" />
            <button id="convertBtn">开始转换</button>
        </div>
        <div class="preview-section" id="previewSection">
            <h2>预览</h2>
            <div id="previewContainer"></div>
        </div>
        <div class="download-section" id="downloadSection" style="display: none;">
            <button id="downloadBtn">下载 PNG 图片</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
